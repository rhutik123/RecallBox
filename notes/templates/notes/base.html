<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RecallBox{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                RecallBox
            </a>

            <div class="d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                <span class="text-light">
                    Hi, {{ user.username }}
                </span>

                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Logout
                    </button>
                </form>
                {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">
                    Login
                </a>
                <a href="{% url 'register' %}" class="btn btn-primary btn-sm">
                    Register
                </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer class="container py-4 text-center text-secondary">
        <small>RecallBox — your knowledge, organized.</small>
    </footer>
</body>

</html>
